<!DOCTYPE html>
<html>
    <head>
        <title>입력 양식</title>
    </head>
    <body>

        <form>
            <fieldset>
                <legend>입력 양식</legend>

                <label for="name">이름</label>
                <input type="text" id="name" name="name">
                <br>

                <label for="email">이메일</label>
                <input type="email" id="email" name="email">
                <br>

                <button type="submit">제출</button>
            </fieldset>
        </form>
    </body>
</html>
